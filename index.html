    <!-- Production Host Guard & Deterrents -->
    <script>
      (function () {
        'use strict';
        const LOGIN_URL = 'https://www.prudle-education.com/log-in-out';
        const ALLOWED_PROD_HOSTS = new Set([
          'www.prudle-education.com',
          'prudle-education.com',
          'abbassaboali-alt.github.io'
        ]);

        // Key interception deterrent for Ctrl+S / Cmd+S
        window.addEventListener('keydown', function (event) {
          if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
            event.preventDefault();
          }
        }, { capture: true });

        const hostname = location.hostname.toLowerCase();
        const isLocalOrDev = hostname === 'localhost' ||
          hostname === '127.0.0.1' ||
          hostname.endsWith('.run.app') ||
          hostname.endsWith('.aistudio.google') ||
          hostname.endsWith('.webcontainer.io');

        if (!isLocalOrDev) {
          const allowed = location.protocol === 'https:' && ALLOWED_PROD_HOSTS.has(hostname);
          if (!allowed) {
            window.stop();
            try { document.documentElement.innerHTML = ''; } catch (_) {}
            window.location.replace(LOGIN_URL);
          }
        }
      })();
    </script>
