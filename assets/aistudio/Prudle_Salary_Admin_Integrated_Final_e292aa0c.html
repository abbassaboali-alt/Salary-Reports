<script type="text/plain" id="prudlePayrollSource">


/* =========================
   Firebase
========================= */
firebase.initializeApp({
  apiKey:"AIzaSyCCFBvZosI8dwShZjxvZzI-SU5igEbcOKk",
  projectId:"prudle-system"
});
const db = firebase.firestore();

/* =========================
   أدوات عامة
========================= */
function getDate(v){
  if(!v) return null;
  return v.toDate ? v.toDate() : new Date(v);
}

function formatYMD(v){
  const d = getDate(v);
  if(!d || isNaN(d)) return "";
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function num(v){
  return Number(v || 0) || 0;
}

function money(v){
  return num(v).toFixed(2);
}

function safeText(v){
  return String(v ?? "").trim();
}

function toMinutes(hhmm){
  if(!hhmm || !hhmm.includes(":")) return 0;
  const [h,m] = hhmm.split(":").map(Number);
  return (h * 60) + m;
}

function minutesToHours(mins){
  return num(mins) / 60;
}

function timeStringFromTS(ts){

  if(!ts) return "";

  let d = null;

  if(ts.toDate){
    d = ts.toDate();
  }else{
    d = new Date(ts);
  }

  if(!d || isNaN(d)){
    return "";
  }

  return d.toTimeString().slice(0,5);

}

/* =========================
   حسابات التقرير - نفس آلية صفحة الحضور
========================= */
/* =========================
   حسابات التقرير - معالجة عبور منتصف الليل
========================= */
function calcPayrollMetrics(record,course){
  const fallback={actualMinutes:num(record?.actualMinutes??0),delayMinutes:num(record?.delayMinutes??0),deductionMinutes:num(record?.deductionMinutes??0),workedMinutes:num(record?.workedMinutes??0),officialMinutes:num(record?.officialMinutes??0)};
  const start=safeText(record?.officialStartTime||course?.courseStartTime||'');
  const end=safeText(record?.officialEndTime||course?.courseEndTime||'');
  if(!/^\d{1,2}:\d{2}$/.test(start)||!/^\d{1,2}:\d{2}$/.test(end))return fallback;
  const tm=v=>{const a=v.split(':').map(Number);return a[0]*60+a[1]};
  let os=tm(start),oe=tm(end);
  if(oe<=os)oe+=1440;
  const official=oe-os;
  if(!record?.startTS||!record?.endTS)return {...fallback,officialMinutes:official,workedMinutes:0,deductionMinutes:0};
  const date=v=>v?.toDate?v.toDate():new Date(v);
  const si=date(record.startTS),ei=date(record.endTS);
  if(isNaN(si)||isNaN(ei))return fallback;
  let rs=si.getHours()*60+si.getMinutes(),re=ei.getHours()*60+ei.getMinutes();
  if(rs<os&&os-rs>600)rs+=1440;
  if(re<=rs)re+=1440;
  const actual=Math.max(0,re-rs);
  const delay=Math.max(0,rs-os);
  const lateDeduction=delay>=15?Math.min(delay,official):0;
  const earlyLeave=Math.max(0,oe-Math.max(os,re));
  const worked=Math.max(0,official-lateDeduction-earlyLeave);
  return {actualMinutes:actual,delayMinutes:delay,deductionMinutes:official-worked,workedMinutes:worked,officialMinutes:official,lateDeductionMinutes:lateDeduction,earlyLeaveMinutes:earlyLeave};
}
/* =========================
   البيانات
========================= */
let ALL_COURSES = [];
let FILTERED_COURSES = [];

/* =========================
   تحميل الدورات
========================= */
db.collection("Courses").onSnapshot(s=>{
  ALL_COURSES = [];

  const sets = {
    Trainer:new Set(),
    Course:new Set(),
    Period:new Set(),
    Section:new Set(),
    Branch:new Set(),
    Start:new Set()
  };

  s.forEach(doc=>{
    const c = doc.data() || {};
    if(c.status === "closed") return;

    const row = { id:doc.id, ...c };
    ALL_COURSES.push(row);

    if(c.Trainer) sets.Trainer.add(c.Trainer);
    if(c.TrainingCourse) sets.Course.add(c.TrainingCourse);
    if(c.Period) sets.Period.add(c.Period);
    if(c.Section) sets.Section.add(c.Section);
    if(c.Branch) sets.Branch.add(c.Branch);

    const sd = formatYMD(c.StartingDate);
    if(sd) sets.Start.add(sd);
  });

  fillSelect("fTrainer", sets.Trainer, "المدرب");
  fillSelect("fCourse", sets.Course, "الدورة");
  fillSelect("fPeriod", sets.Period, "الفترة");
  fillSelect("fSection", sets.Section, "القسم");
  fillSelect("fBranch", sets.Branch, "الفرع");
  fillSelect("fStart", sets.Start, "تاريخ البداية");

  applyFilters();
});

function fillSelect(id, set, title){
  const el = document.getElementById(id);
  const oldVal = el.value;
  el.innerHTML = `<option value="">${title}</option>`;
  [...set].sort((a,b)=>String(a).localeCompare(String(b),"ar")).forEach(v=>{
    el.innerHTML += `<option value="${String(v).replace(/"/g,'&quot;')}">${v}</option>`;
  });
  if([...el.options].some(o=>o.value === oldVal)) el.value = oldVal;
}

/* =========================
   الفلاتر
========================= */
document.querySelectorAll(".filters select").forEach(s=>s.onchange = applyFilters);

function applyFilters(){
  const t = document.getElementById("fTrainer").value;
  const c = document.getElementById("fCourse").value;
  const p = document.getElementById("fPeriod").value;
  const s = document.getElementById("fSection").value;
  const b = document.getElementById("fBranch").value;
  const d = document.getElementById("fStart").value;

  if(!t && !c && !p && !s && !b && !d){
    FILTERED_COURSES = [];
    document.getElementById("coursesMulti").innerHTML = "";
    document.getElementById("note").style.display = "block";
    document.getElementById("tools").style.display = "none";
    document.getElementById("summaryPreview").style.display = "none";
    return;
  }

  FILTERED_COURSES = ALL_COURSES.filter(x=>{
    if(t && x.Trainer !== t) return false;
    if(c && x.TrainingCourse !== c) return false;
    if(p && x.Period !== p) return false;
    if(s && x.Section !== s) return false;
    if(b && x.Branch !== b) return false;
    if(d && formatYMD(x.StartingDate) !== d) return false;
    return true;
  });

  renderCourses(FILTERED_COURSES);
}

function renderCourses(arr){
  const coursesMulti = document.getElementById("coursesMulti");
  const note = document.getElementById("note");
  const tools = document.getElementById("tools");
  const summaryPreview = document.getElementById("summaryPreview");

  coursesMulti.innerHTML = "";
  note.style.display = arr.length ? "none" : "block";
  tools.style.display = arr.length ? "flex" : "none";
  summaryPreview.style.display = arr.length ? "block" : "none";

  if(!arr.length){
    summaryPreview.innerHTML = "";
    note.textContent = "لا توجد دورات مطابقة للفلاتر الحالية";
    return;
  }

  const totalHourPrice = arr.reduce((a,c)=>a + num(c.HourPrice || c.hourPrice || 0), 0);
  const avgHourPrice = arr.length ? (totalHourPrice / arr.length) : 0;

  summaryPreview.innerHTML = `
    عدد الدورات المطابقة: ${arr.length}
    <div class="statGrid">
      <div class="statBox">
        <div class="small">متوسط سعر الساعة</div>
        <b>${money(avgHourPrice)} ريال</b>
      </div>
      <div class="statBox">
        <div class="small">إجمالي المدربين الظاهرين</div>
        <b>${new Set(arr.map(x=>x.Trainer || "-")).size}</b>
      </div>
      <div class="statBox">
        <div class="small">آلية الحساب</div>
        <b style="font-size:14px">البريك مدفوع | لا توجد ساعات إضافية | سماح أقل من 15 دقيقة | خصم التأخير من 15 دقيقة والخروج المبكر </b>
      </div>
    </div>
  `;

  arr.forEach(c=>{
    const price = num(c.HourPrice || c.hourPrice || 0);

    coursesMulti.innerHTML += `
      <div class="course-item" id="row_${c.id}">
        <div>
          <input type="checkbox" class="courseCheck" value="${c.id}">
        </div>

        <div class="course-main">
          <div>
            <b>${c.Trainer || "-"}</b>
            <span class="badge">${c.TrainingCourse || "-"}</span>
          </div>
          <div class="rowMeta">
            الفترة: ${c.Period || "-"} |
            الفرع: ${c.Branch || "-"} |
            القسم: ${c.Section || "-"} |
            البداية: ${formatYMD(c.StartingDate) || "-"} |
            الدوام: ${safeText(c.courseStartTime || "--:--")} → ${safeText(c.courseEndTime || "--:--")}
          </div>
        </div>

        <div>
          <div class="small">السعر الحالي</div>
          <b id="currentPrice_${c.id}">${money(price)} ريال</b>
        </div>

        <div class="priceWrap">
          <input type="number" min="0" step="0.01" class="priceInput" id="price_${c.id}" value="${price}">
        </div>

        <div class="priceWrap">
          <button class="saveMini" onclick="saveHourPrice('${c.id}')">حفظ السعر</button>
        </div>
      </div>
    `;
  });
}

function toggleAll(v){
  document.querySelectorAll(".courseCheck").forEach(c=>c.checked = v);
}

/* =========================
   حفظ سعر الساعة
========================= */
async function saveHourPrice(courseId){
  const input = document.getElementById("price_" + courseId);
  if(!input) return;

  const newPrice = num(input.value);

  try{
    await db.collection("Courses").doc(courseId).set({
      HourPrice:newPrice,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy:localStorage.getItem("username") || "system"
    }, {merge:true});

    const course = ALL_COURSES.find(x=>x.id === courseId);
    if(course){
      course.HourPrice = newPrice;
      course.hourPrice = newPrice;
    }

    const currentPriceEl = document.getElementById("currentPrice_" + courseId);
    if(currentPriceEl) currentPriceEl.textContent = `${money(newPrice)} ريال`;

    alert("تم حفظ سعر الساعة بنجاح");
  }catch(err){
    console.error(err);
    alert("حدث خطأ أثناء حفظ سعر الساعة");
  }
}

/* =========================
   التصدير PDF
========================= */
async function exportMultiPDF(){
  const ids = [...document.querySelectorAll(".courseCheck:checked")].map(x=>x.value);

  if(!ids.length){
    alert("يرجى تحديد دورة واحدة على الأقل");
    return;
  }

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("landscape","mm","a4");

  const BLUE = [22,68,120];
  const GOLD = [247,210,124];

  function header(){
    pdf.setFillColor(...BLUE);
    pdf.rect(0,0,297,22,"F");

    try{
      pdf.addImage(
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlEGHcXcelOlihtrBLFCmjumIyuBxqyoWEZM8DgDpBVg&s",
        "PNG",
        10,3,16,16
      );
    }catch(e){}

    pdf.setTextColor(255,255,255);
    pdf.setFontSize(16);
    pdf.text("Prudle Trainers Payroll Report", 148, 14, {align:"center"});
    pdf.setTextColor(0,0,0);
  }

  const TRAINERS = {};

  for(const id of ids){
    const course = ALL_COURSES.find(x=>x.id === id);
    if(!course) continue;

    const trainer = course.Trainer || "Unknown";

    if(!TRAINERS[trainer]){
      TRAINERS[trainer] = {
        courses:[],
        totalWorkedHours:0,
        totalActualHours:0,
        totalDeductionHours:0,
        totalDelayMinutes:0,
        totalSalary:0,
        totalDeductionSalary:0
      };
    }

    const inputEl = document.getElementById("price_" + id);
    const livePrice = inputEl ? num(inputEl.value) : num(course.HourPrice || course.hourPrice || 0);

    const snap = await db.collection("Courses").doc(id).collection("Attendance").get();

    let courseWorkedHours = 0;
    let courseActualHours = 0;
    let courseDeductionHours = 0;
    let courseDelayMinutes = 0;
    let attendanceDays = 0;

    let firstIn = null;
    let lastOut = null;

snap.forEach(doc=>{

  const r = doc.data() || {};
  const metrics = calcPayrollMetrics(r, course);

  const actualHours =
    minutesToHours(metrics.actualMinutes);

  const deductionHours =
    minutesToHours(metrics.deductionMinutes);

  const workedHours =
    minutesToHours(metrics.workedMinutes);

  courseActualHours += minutesToHours(metrics.officialMinutes || metrics.actualMinutes);
  courseDeductionHours += deductionHours;
  courseWorkedHours += workedHours;
  courseDelayMinutes += metrics.delayMinutes;

  if(r.startTS){

    const v =
      r.startTS.toDate
        ? r.startTS.toDate()
        : new Date(r.startTS);

    if(!isNaN(v) && (!firstIn || v < firstIn)){
      firstIn = v;
    }

  }

  if(r.endTS){

    const v =
      r.endTS.toDate
        ? r.endTS.toDate()
        : new Date(r.endTS);

    if(!isNaN(v) && (!lastOut || v > lastOut)){
      lastOut = v;
    }

  }

  if(r.startTS && r.endTS) attendanceDays++;

});

/*
  إجمالي الراتب قبل الخصم:
  الساعات الفعلية المسجلة × سعر الساعة
*/
const grossSalary =
  courseActualHours * livePrice;

/*
  قيمة الخصم:
  ساعات الخصم × سعر الساعة
*/
const deductionSalary =
  courseDeductionHours * livePrice;

/*
  صافي الراتب:
  الساعات المحتسبة بعد الخصم × سعر الساعة
*/
const netSalary =
  courseWorkedHours * livePrice;
    TRAINERS[trainer].courses.push({
      courseId:id,
      name:course.TrainingCourse || "-",
      period:course.Period || "-",
      branch:course.Branch || "-",
      section:course.Section || "-",
      start:formatYMD(course.StartingDate) || "-",
// البحث عن هذا السطر وتغييره:
officialTime: `${safeText(course.courseStartTime || "00:00")} - ${safeText(course.courseEndTime || "00:00")}`,
      in:firstIn ? firstIn.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) : "--",
      out:lastOut ? lastOut.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) : "--",
      price:livePrice,
      days:attendanceDays,
      actualHours:courseActualHours,
      workedHours:courseWorkedHours,
      deductionHours:courseDeductionHours,
      delayMinutes:courseDelayMinutes,
      grossSalary:grossSalary,
      deductionSalary:deductionSalary,
      netSalary:netSalary,
      note:course.courseNote || "-"
    });

    TRAINERS[trainer].totalWorkedHours += courseWorkedHours;
    TRAINERS[trainer].totalActualHours += courseActualHours;
    TRAINERS[trainer].totalDeductionHours += courseDeductionHours;
    TRAINERS[trainer].totalDelayMinutes += courseDelayMinutes;
    TRAINERS[trainer].totalSalary += netSalary;
    TRAINERS[trainer].totalDeductionSalary += deductionSalary;
  }

  let arr = Object.entries(TRAINERS);

  const sortBy = document.getElementById("sortBy").value;
  if(sortBy === "hours"){
    arr.sort((a,b)=>b[1].totalWorkedHours - a[1].totalWorkedHours);
  }else if(sortBy === "salary"){
    arr.sort((a,b)=>b[1].totalSalary - a[1].totalSalary);
  }else if(sortBy === "deduction"){
    arr.sort((a,b)=>b[1].totalDeductionHours - a[1].totalDeductionHours);

    pdf.setFillColor(...GOLD);
    pdf.roundedRect(8, y-4, 281, 10, 2, 2, "F");

    pdf.setFontSize(13);
    pdf.setTextColor(...BLUE);
const price = data.courses[0]?.price || 0;

pdf.setFontSize(13);
pdf.setTextColor(...BLUE);

pdf.text(`Net Salary: ${data.totalSalary.toFixed(2)} SAR`,220,y+2);

pdf.setTextColor(0,0,0);    pdf.setTextColor(0,0,0);
    y += 10;

    pdf.autoTable({
      startY:y,

        "Course","Period","Branch","Section","Start Date","Official Time","Days",
        "In","Out","Hour Price",
        "Recorded Hours","Deduction Hours","Payable Hours",
        "Delay Min","Gross Salary","Deduction","Net Salary","Note"
      ]],

        c.name,
        c.period,
        c.branch,
        c.section,
        c.start,
        c.officialTime,
        c.days,
        c.in,

        c.deductionHours.toFixed(2),
        c.workedHours.toFixed(2),
        c.delayMinutes.toFixed(0),
        c.grossSalary.toFixed(2),
        c.deductionSalary.toFixed(2),
        c.netSalary.toFixed(2),
        c.note
      ]),
      theme:"grid",
      headStyles:{fillColor:BLUE,textColor:255,fontSize:8},
      styles:{fontSize:7,cellPadding:2,overflow:"linebreak"},
      margin:{left:8,right:8}
    });

    y = pdf.lastAutoTable.finalY + 8;

    pdf.setFontSize(10);
    pdf.setTextColor(...BLUE);
pdf.text(
"Trainer Total | Recorded: " + data.totalActualHours.toFixed(2) +
" | Deduction: " + data.totalDeductionHours.toFixed(2) +
" | Payable: " + data.totalWorkedHours.toFixed(2) +
" | Delay: " + data.totalDelayMinutes.toFixed(0) +
" | Net Salary: " + data.totalSalary.toFixed(2) + " SAR",
10,
y
);    pdf.setTextColor(0,0,0);

    y += 10;

    grandActualHours += data.totalActualHours;
    grandWorkedHours += data.totalWorkedHours;
    grandDeductionHours += data.totalDeductionHours;

  if(y > 180){
    pdf.addPage();
    header();
    y = 35;
  }

  pdf.setFillColor(232,240,255);
  pdf.roundedRect(8, y-5, 281, 24, 2, 2, "F");

  pdf.setFontSize(14);
  pdf.setTextColor(...BLUE);
  pdf.text("GRAND TOTAL", 10, y+2);

  pdf.setFontSize(11);
  pdf.text(
    `Recorded Hours: ${grandActualHours.toFixed(2)} | Deduction Hours: ${grandDeductionHours.toFixed(2)} | Payable Hours: ${grandWorkedHours.toFixed(2)}`,
    10, y+10
  );
  pdf.text(
    `Total Delay Minutes: ${grandDelayMinutes.toFixed(0)} | Salary Deduction: ${grandDeductionSalary.toFixed(2)} SAR | Net Salary: ${grandNetSalary.toFixed(2)} SAR`,
    10, y+17
  );

  pdf.save("Trainers_Payroll_With_Deductions.pdf");
}

function escPayroll(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function printModernPayroll(lang){
 const ar=lang==='ar';
 const ids=[...document.querySelectorAll('.courseCheck:checked')].map(x=>x.value);
 if(!ids.length){alert(ar?'حدد دورة واحدة على الأقل':'Select at least one course');return;}
 // Reserve print window on a direct click (before any async reads, to avoid popup blockers).
 const win=window.open('','_blank');
 if(!win){alert(ar?'يُرجى السماح بفتح نافذة الطباعة':'Please allow the print popup');return;}
 win.document.write('<html><head><meta charset="utf-8"><title>Prudle Payroll</title></head><body style="font-family:Arial;padding:30px">'+(ar?'جارٍ تجهيز تقرير الرواتب...':'Preparing payroll report...')+'</body></html>');
 try{
  const rows=[];
  for(const id of ids){
   const course=ALL_COURSES.find(x=>x.id===id);if(!course)continue;
   const price=num(document.getElementById('price_'+id)?.value??course.HourPrice??course.hourPrice??0);
   const snap=await db.collection('Courses').doc(id).collection('Attendance').get();
   let days=0,official=0,actual=0,worked=0,deduct=0,delay=0;
   snap.forEach(doc=>{
    const r=doc.data()||{};
    // No blank/incomplete attendance day is counted as a payable day.
    if(!r.startTS||!r.endTS)return;
    const m=calcPayrollMetrics(r,course);
    days++; official+=num(m.officialMinutes);actual+=num(m.actualMinutes);
    worked+=num(m.workedMinutes);deduct+=num(m.deductionMinutes);delay+=num(m.delayMinutes);
   });
   rows.push({trainer:course.Trainer||'-',course:course.TrainingCourse||'-',period:course.Period||'-',branch:course.Branch||'-',section:course.Section||'-',start:formatYMD(course.StartingDate)||'-',days,official,actual,worked,deduct,delay,price,gross:official/60*price,net:worked/60*price});
  }
  rows.sort((a,b)=>a.trainer.localeCompare(b.trainer,ar?'ar':'en'));
  const total=k=>rows.reduce((sum,r)=>sum+r[k],0);
  const moneyFmt=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const hr=n=>(n/60).toFixed(2);
  const labels=ar?['المدرب','الدورة','الفترة','الفرع / القسم','الأيام','الساعات الرسمية','ساعات مستحقة','الخصم (س)','سعر الساعة','صافي الراتب']:['Trainer','Course','Period','Branch / Section','Days','Official hrs','Payable hrs','Deducted hrs','Hourly rate','Net salary'];
  const body=rows.map((r,i)=>`<tr><td>${i+1}</td><td class="name">${escPayroll(r.trainer)}</td><td>${escPayroll(r.course)}</td><td>${escPayroll(r.period)}</td><td>${escPayroll(r.branch)} / ${escPayroll(r.section)}</td><td>${r.days}</td><td>${hr(r.official)}</td><td><b>${hr(r.worked)}</b></td><td>${hr(r.deduct)}</td><td>${moneyFmt(r.price)}</td><td class="amount">${moneyFmt(r.net)}</td></tr>`).join('');
  const totalSalary=rows.reduce((a,r)=>a+r.net,0);
  const title=ar?'تقرير رواتب المدربين':'TRAINERS PAYROLL REPORT';
  const subtitle=ar?'معهد برودل للغات · تقرير مالي':'PRUDLE LANGUAGE INSTITUTE · FINANCIAL REPORT';
  const printlabel=ar?'طباعة / حفظ PDF':'Print / Save PDF';
  const html=`<!doctype html><html lang="${ar?'ar':'en'}" dir="${ar?'rtl':'ltr'}"><head><meta charset="utf-8"><title>${title}</title><style>
  @page{size:A4 landscape;margin:12mm}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f2f5fa;color:#183047} .sheet{max-width:1400px;margin:26px auto;background:white;padding:30px;box-shadow:0 6px 28px #102e4a1a}.head{display:flex;justify-content:space-between;align-items:center;background:#153c65;color:white;border-radius:14px;padding:21px 25px}.brand{font-size:27px;font-weight:900;letter-spacing:1px}.sub{font-size:12px;opacity:.83;margin-top:5px}.heading{font-size:22px;font-weight:800}.meta{font-size:12px;margin-top:7px;opacity:.8}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.metric{background:#f3f7fc;border:1px solid #dfebf6;border-radius:10px;padding:13px}.metric small{display:block;color:#6c7d90;font-size:11px;margin-bottom:8px}.metric strong{font-size:20px;color:#153c65}table{width:100%;border-collapse:collapse;font-size:11px}thead{background:#173f6b;color:white}th{padding:10px 6px;text-align:center}td{padding:11px 6px;text-align:center;border-bottom:1px solid #e6ebf1}.name{text-align:start;font-weight:700}tbody tr:nth-child(even){background:#f7f9fc}.amount{font-weight:900;color:#146f64}tfoot{background:#e8f1fa;font-weight:bold}tfoot td{border-top:2px solid #164478}.footer{margin-top:18px;display:flex;justify-content:space-between;color:#748196;font-size:10px;border-top:1px solid #dce6ed;padding-top:13px}.action{margin:10px auto;display:block;padding:10px 20px;background:#146f64;color:white;border:0;border-radius:8px;cursor:pointer}.note{margin-top:12px;font-size:11px;color:#607589}@media print{body{background:#fff}.sheet{padding:0;box-shadow:none;margin:0}.action{display:none}.head,.metric,thead,tfoot{-webkit-print-color-adjust:exact;print-color-adjust:exact}tr{break-inside:avoid}}
  </style></head><body><button class="action" onclick="window.print()">${printlabel}</button><div class="sheet"><div class="head"><div><div class="brand">PRUDLE</div><div class="sub">${subtitle}</div></div><div><div class="heading">${title}</div><div class="meta">${new Date().toLocaleDateString(ar?'ar-SA':'en-GB')}</div></div></div>
  <div class="cards"><div class="metric"><small>${ar?'عدد الدورات':'Courses'}</small><strong>${rows.length}</strong></div><div class="metric"><small>${ar?'الساعات الرسمية':'Official hours'}</small><strong>${hr(total('official'))}</strong></div><div class="metric"><small>${ar?'الساعات المستحقة':'Payable hours'}</small><strong>${hr(total('worked'))}</strong></div><div class="metric"><small>${ar?'إجمالي صافي الرواتب':'Total net pay'}</small><strong>${moneyFmt(totalSalary)} SAR</strong></div></div>
  <table><thead><tr><th>#</th>${labels.map(v=>'<th>'+v+'</th>').join('')}</tr></thead><tbody>${body}</tbody><tfoot><tr><td colspan="6">${ar?'الإجمالي':'Total'}</td><td>${hr(total('official'))}</td><td>${hr(total('worked'))}</td><td>${hr(total('deduct'))}</td><td>—</td><td>${moneyFmt(totalSalary)}</td></tr></tfoot></table><div class="note">${ar?'البريك مدفوع. لا تحتسب الساعات خارج الدوام الرسمي. التأخير الأقل من 15 دقيقة سماح؛ من 15 دقيقة يخصم كامل التأخير. الخروج المبكر يُخصم.':'Paid breaks. No overtime. Late arrival under 15 minutes is waived; at 15+ minutes the full lateness is deducted. Early departure is deducted.'}</div><div class="footer"><span>Prudle Education</span><span>${ar?'تقرير مستخرج من سجلات الحضور':'Generated from attendance records'}</span></div></div></body></html>`;
  win.document.open();win.document.write(html);win.document.close();
 }catch(err){console.error(err);win.document.body.textContent=(ar?'تعذر تحميل التقرير: ':'Failed to load report: ')+err.message;}
}

</script>

<script>
(function(){
  "use strict";
  const LOGIN="https://www.prudle-education.com/log-in-out";
  const TRUSTED_PARENTS=new Set([
    "https://www.prudle-education.com",
    "https://prudle-education.com",
    "https://prudle-system.webflow.io",
    "https://app.prudle.edu.sa"
  ]);
  let launched=false;
  const clean=v=>String(v??"").trim();
  function rolesFrom(data){
    const found=[];
    function add(v){if(typeof v==="string"&&v.trim())found.push(v.trim().toLowerCase());}
    let values=data?.roles;
    if(typeof values==="string"){
      try{values=JSON.parse(values)}catch(e){values=values.split(",")}
    }
    if(Array.isArray(values))values.forEach(add);
    add(data?.role);add(data?.userRole);
    return [...new Set(found)];
  }
  function localIdentity(){
    let roles=[];
    try{roles=JSON.parse(localStorage.getItem("roles")||"[]")}catch(e){roles=[]}
    return {
      username:clean(localStorage.getItem("username")||localStorage.getItem("userName")||localStorage.getItem("displayName")),
      roles,role:localStorage.getItem("role"),userRole:localStorage.getItem("userRole")
    };
  }
  function message(text){const node=document.getElementById("prudleAccessMessage");if(node)node.textContent=text;}
  function launch(identity){
    if(launched)return;
    if(!clean(identity?.username)||!rolesFrom(identity).includes("admin")){
      message("هذه الصفحة مخصصة للمسؤولين بصلاحية Admin فقط.");return;
    }
    launched=true;
    // Only activate the original Firestore reads once the interface role check passes.
    document.documentElement.classList.add("prudle-access-granted");
    const source=document.getElementById("prudlePayrollSource");
    const script=document.createElement("script");
    script.textContent=source.textContent;
    document.body.appendChild(script);
  }
  window.logout=function(){
    localStorage.removeItem("username");localStorage.removeItem("role");
    localStorage.removeItem("roles");localStorage.removeItem("userRole");
    localStorage.removeItem("loginDate");
    sessionStorage.clear();
    window.top.location.replace(LOGIN+"?logout="+Date.now());
  };
  window.addEventListener("message",event=>{
    if(window.parent===window||event.source!==window.parent||!TRUSTED_PARENTS.has(event.origin))return;
    const d=event.data;
    if(!d||typeof d!=="object"||!["PRUDLE_USER_INFO","PRUDLE_USER_CONTEXT"].includes(d.type))return;
    launch(d);
  });
  function requestParent(){
    if(window.parent===window)return;
    for(const target of TRUSTED_PARENTS){
      window.parent.postMessage({type:"PRUDLE_REQUEST_USER_INFO"},target);
    }
  }
  window.addEventListener("DOMContentLoaded",()=>{
    launch(localIdentity());
    requestParent();
    if(!launched)message("يتطلب عرض الرواتب صلاحية Admin. يرجى فتح الصفحة من لوحة الإدارة في برودل.");
  });
  window.addEventListener("pageshow",()=>{if(!launched)requestParent();});
})();
</script>
